name: Build, Sign and Upload APK in Releases
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Upload APK in Releases
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant Permission to Execute
        run: chmod +x gradlew

      # Parse variables from dependencies.gradle
      - name: Extract version from dependencies.gradle
        id: get_version
        run: |
          # Suche nach dem Key, extrahiere den Wert nach dem Doppelpunkt und entferne Kommas/Leerzeichen
          MAJOR=$(sed -n 's/.*versionMajor:\s*\([0-9]*\).*/\1/p' dependencies.gradle)
          MINOR=$(sed -n 's/.*versionMinor:\s*\([0-9]*\).*/\1/p' dependencies.gradle)
          PATCH=$(sed -n 's/.*versionPatch:\s*\([0-9]*\).*/\1/p' dependencies.gradle)

          # Combine into a standard semantic version string (e.g., 1.2.3)
          VERSION_NAME="${MAJOR:-0}.${MINOR:-0}.${PATCH:-0}"

          # Validierung: Falls ein Wert leer ist, wird v0.0.0 als Fallback gesetzt
          VERSION_TAG="v${MAJOR:-0}.${MINOR:-0}.${PATCH:-0}"

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "Extracted Version: $VERSION_NAME"

      # Run Build Project
      - name: Build gradle project
        run: bash ./gradlew build -PversionName="${{ env.VERSION_NAME }}" --stacktrace

      # Create APK Debug
      - name: Build apk debug APK
        run: bash ./gradlew assembleDebug -PversionName="${{ env.VERSION_NAME }}" --stacktrace

      # Create APK Release
      - name: Build apk release APK
        run: bash ./gradlew assembleRelease -PversionName="${{ env.VERSION_NAME }}" --stacktrace

      # Create Bundle AAB Debug
      - name: Build bundle debug AAB
        run: bash ./gradlew bundleDebug -PversionName="${{ env.VERSION_NAME }}" --stacktrace

      # Create Bundle AAB Release
      # Noted for main module build [main_project_module]:bundleRelease
      - name: Build bundle release AAB
        run: bash ./gradlew bundleRelease -PversionName="${{ env.VERSION_NAME }}" --stacktrace

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > my-release-key.jks

      # With ABI splits enabled gradle produces app-<abi>-release-unsigned.apk for every ABI
      # plus app-universal-release-unsigned.apk. Every one of them is aligned and signed.
      - name: Align APKs
        run: |
          shopt -s nullglob
          files=(app/build/outputs/apk/release/app-*-release-unsigned.apk)
          [ ${#files[@]} -gt 0 ] || { echo "No unsigned release APKs found"; exit 1; }
          for f in "${files[@]}"; do
            $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 "$f" "${f/-unsigned.apk/-signed.apk}"
          done

      - name: Align AAB
        run: |
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 \
            app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/bundle/release/app-release-signed.aab

      - name: Sign APKs with apksigner
        run: |
          shopt -s nullglob
          for f in app/build/outputs/apk/release/app-*-release-signed.apk; do
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
              --ks my-release-key.jks \
              --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
              --key-pass pass:${{ secrets.KEY_PASSWORD }} \
              --ks-key-alias ${{ secrets.KEY_ALIAS }} \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled false \
              "$f"
          done

      - name: Sign AAB with apksigner
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --min-sdk-version 26 \
            --ks my-release-key.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            app/build/outputs/bundle/release/app-release-signed.aab

      - name: Verify aligned APK signatures
        run: |
          shopt -s nullglob
          for f in app/build/outputs/apk/release/app-*-release-signed.apk; do
            echo "== $f"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs "$f"
          done

      - name: Verify aligned AAB signature
        run: |
          # Ermittelt die Browser-Download-URL der neuesten bundletool-all-*.jar
          URL=$(curl -s https://api.github.com/repos/google/bundletool/releases/latest \
            | jq -r '.assets[] | select(.name | test("bundletool-all-.*\\.jar")) | .browser_download_url')
          curl -L "$URL" -o bundletool.jar
          
          # Lädt das bundletool-all-*.jar Asset des neuesten Releases direkt herunter
          # gh release download --repo google/bundletool --pattern "bundletool-all-*.jar"
          # Benennt die Datei um, da der Name die Versionsnummer enthält
          # mv bundletool-all-*.jar bundletool.jar
          
          # Ausführung des Verifizierungs-Befehls
          java -jar bundletool.jar validate --bundle=app/build/outputs/bundle/release/app-release-signed.aab

      # Collects everything under its final release name in dist/:
      #   a_untis_release_signed.apk / .aab        (universal APK = all ABIs)
      #   a_untis_release_signed_<abi>.apk         (arm64-v8a, armeabi-v7a, x86, x86_64)
      #   app-release-signed.apk                   (legacy alias of the universal release APK)
      #   a_untis_debug.apk / .aab                 (universal APK = all ABIs)
      #   a_untis_debug_<abi>.apk
      - name: Rename files for release
        run: |
          shopt -s nullglob
          mkdir -p dist

          rename_apks() { # <input dir> <gradle suffix> <final base name>
            local dir="$1" suffix="$2" base="$3" count=0
            for f in "$dir"/app-*-"$suffix".apk; do
              local abi
              abi=$(basename "$f"); abi=${abi#app-}; abi=${abi%-"$suffix".apk}
              if [ "$abi" = "universal" ]; then
                cp "$f" "dist/${base}.apk"
              else
                cp "$f" "dist/${base}_${abi}.apk"
              fi
              count=$((count + 1))
            done
            [ "$count" -gt 0 ] || { echo "No APKs found in $dir for $suffix"; exit 1; }
          }

          rename_apks app/build/outputs/apk/release release-signed a_untis_release_signed
          rename_apks app/build/outputs/apk/debug   debug          a_untis_debug

          # Alias with the pre-rename name: already installed app versions look for exactly
          # "app-release-signed.apk" in the latest release (old UpdateManager), so without
          # this they would never find the update. Identical to the universal APK.
          cp dist/a_untis_release_signed.apk dist/app-release-signed.apk

          cp app/build/outputs/bundle/release/app-release-signed.aab dist/a_untis_release_signed.aab
          cp app/build/outputs/bundle/debug/app-debug.aab            dist/a_untis_debug.aab

          ls -l dist

      - name: Upload APKs to Github Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: apk files
          path: dist/*.apk

      - name: Upload AABs to Github Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aab files
          path: dist/*.aab

      # softprops/action-gh-release replaces the deprecated actions/create-release
      # and actions/upload-release-asset — it creates the release and uploads all
      # assets in a single step, and runs on Node.js 20+.
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Release ${{ env.VERSION_TAG }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/*.apk
            dist/*.aab
