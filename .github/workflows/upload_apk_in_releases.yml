name: Build, Sign and Release
on:
  push:
    paths:
      - 'dependencies.gradle' # Triggert den Workflow nur, wenn diese Datei geändert wird
  workflow_dispatch: # Ermöglicht weiterhin den manuellen Start im Notfall

permissions:
  contents: write

env:
  VERSION_NAME: ""
  VERSION_TAG: ""

jobs:
  apk:
    name: Upload APK in Releases
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Holt die gesamte Git-Historie, um Tags zuverlässig zu prüfen

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant Permission to Execute
        run: chmod +x gradlew

      # Parse variables from dependencies.gradle
      - name: Extract version from dependencies.gradle
        id: get_version
        run: |
          MAJOR=$(sed -n 's/.*versionMajor:\s*\([0-9]*\).*/\1/p' dependencies.gradle)
          MINOR=$(sed -n 's/.*versionMinor:\s*\([0-9]*\).*/\1/p' dependencies.gradle)
          PATCH=$(sed -n 's/.*versionPatch:\s*\([0-9]*\).*/\1/p' dependencies.gradle)

          VERSION_NAME="${MAJOR:-0}.${MINOR:-0}.${PATCH:-0}"
          VERSION_TAG="v${MAJOR:-0}.${MINOR:-0}.${PATCH:-0}"

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "Extracted Version: $VERSION_NAME"

      # Verhindert Builds, falls die Datei geändert, aber die Version nicht erhöht wurde
      - name: Check if release tag already exists
        id: check_tag
        run: |
          if git rev-parse "${{ env.VERSION_TAG }}" >/dev/null 2>&1; then
            echo "Version ${{ env.VERSION_TAG }} existiert bereits. Überspringe Build."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Neue Version erkannt: ${{ env.VERSION_TAG }}. Fahre fort."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Optimierter, kombinierter Build (Spart viel Zeit und baut alles in einem Rutsch)
      - name: Build All APKs and AABs
        if: steps.check_tag.outputs.exists != 'true'
        run: ./gradlew assembleDebug assembleRelease bundleDebug bundleRelease -PversionName="${{ env.VERSION_NAME }}" --stacktrace --parallel

      - name: Decode keystore
        if: steps.check_tag.outputs.exists != 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > my-release-key.jks

      # Align APKs
      - name: Align APKs
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          shopt -s nullglob
          
          # Sucht nach allen Release-APKs im Ausgabeordner
          files=(app/build/outputs/apk/release/*.apk)
          
          [ ${#files[@]} -gt 0 ] || { echo "No release APKs found at all"; exit 1; }
          
          for f in "${files[@]}"; do
            # Überspringe Dateien, die bereits "-signed" oder "-aligned" im Namen tragen
            [[ "$f" == *"-signed.apk" ]] && continue
            [[ "$f" == *"-aligned.apk" ]] && continue
            
            # Bestimme den neuen Dateinamen (ersetzt -unsigned falls vorhanden, ansonsten hängt es -signed an)
            if [[ "$f" == *"-unsigned.apk" ]]; then
              target="${f/-unsigned.apk/-signed.apk}"
            else
              target="${f/.apk/-signed.apk}"
            fi
            
            echo "Aligning $f -> $target"
            $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 "$f" "$target"
          done

      - name: Align AAB
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 \
            app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/bundle/release/app-release-signed.aab

      - name: Sign APKs with apksigner
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          shopt -s nullglob
          # Findet app-release-signed.apk sowie app-arm64-v8a-release-signed.apk
          for f in app/build/outputs/apk/release/app*-release-signed.apk; do
            echo "Signing: $f"
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
              --ks my-release-key.jks \
              --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
              --key-pass pass:${{ secrets.KEY_PASSWORD }} \
              --ks-key-alias ${{ secrets.KEY_ALIAS }} \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled false \
              "$f"
          done

      # KORREKTUR: AABs müssen mit jarsigner signiert werden
      - name: Sign AAB with jarsigner
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          jarsigner -keystore my-release-key.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            app/build/outputs/bundle/release/app-release-signed.aab \
            "${{ secrets.KEY_ALIAS }}"

      - name: Verify aligned APK signatures
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          shopt -s nullglob
          for f in app/build/outputs/apk/release/app*-release-signed.apk; do
            echo "== Verifying $f"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs "$f"
          done

      # KORREKTUR: If-Guard hinzugefügt
      - name: Verify aligned AAB signature
        if: steps.check_tag.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo google/bundletool --pattern "bundletool-all-*.jar"
          mv bundletool-all-*.jar bundletool.jar
          java -jar bundletool.jar validate --bundle=app/build/outputs/bundle/release/app-release-signed.aab

      # Rename files for release
      - name: Rename files for release
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          shopt -s nullglob
          mkdir -p dist

          rename_apks() {
            local dir="$1" suffix="$2" base="$3" count=0
            for f in "$dir"/app-*-"$suffix".apk; do
              local abi
              abi=$(basename "$f"); abi=${abi#app-}; abi=${abi%-"$suffix".apk}
              if [ "$abi" = "universal" ]; then
                cp "$f" "dist/${base}.apk"
              else
                cp "$f" "dist/${base}_${abi}.apk"
              fi
              count=$((count + 1))
            done
            [ "$count" -gt 0 ] || { echo "No APKs found in $dir for $suffix"; exit 1; }
          }

          rename_apks app/build/outputs/apk/release release-signed a_untis_release_signed
          rename_apks app/build/outputs/apk/debug   debug          a_untis_debug

          cp dist/a_untis_release_signed.apk dist/app-release-signed.apk
          cp app/build/outputs/bundle/release/app-release-signed.aab dist/a_untis_release_signed.aab
          cp app/build/outputs/bundle/debug/app-debug.aab            dist/a_untis_debug.aab

          ls -l dist

      - name: Upload APKs to Github Artifacts
        if: steps.check_tag.outputs.exists != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: apk files
          path: dist/*.apk

      - name: Upload AABs to Github Artifacts
        if: steps.check_tag.outputs.exists != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: aab files
          path: dist/*.aab

      - name: Create Release and Upload Assets
        if: steps.check_tag.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Release ${{ env.VERSION_NAME }}
          draft: false
          prerelease: false
          files: |
            dist/*.apk
            dist/*.aab
